name: Test and deploy GRE notebook
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run cf:test
      - run: node scripts/test-vocab-progress.cjs
      - name: Use production resource identifiers (no credentials in this file)
        run: cp cloudflare.production.json cloudflare.config.json
      - run: npm run cf:build
      - run: npm run cf:check
      - uses: actions/upload-artifact@v4
        with:
          name: cloudflare-build
          path: dist/
          retention-days: 7
  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: c8104783e34180ab35324ca0172b925b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: cloudflare-build
          path: dist/
      - name: Require deployment credential
        run: test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Set the repository secret CLOUDFLARE_API_TOKEN.'; exit 1; }
      - name: Apply forward schema migrations (never reimport local notes)
        run: npx wrangler d1 migrations apply DB --remote --config dist/server/wrangler.cloudflare.json
      - name: Deploy
        run: npx wrangler deploy --config dist/server/wrangler.cloudflare.json
